name: 기능 구현 (Feat)
description: 기능 구현 작업을 위한 템플릿
title: "[Feat]: "
labels: ["feat"]
body:
  - type: input
    id: branch_keyword
    attributes:
      label: "Branch Keyword"
      description: "영문 소문자로 간결한 브랜치 명을 입력하세요 (예: event-generator, db-schema)"
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: "구현할 기능"
      description: "어떤 기능을 구현할지 간략하게 설명해주세요"
    validations:
      required: true

  - type: textarea
    id: test_plan
    attributes:
      label: "테스트 계획"
      description: "기능 검증을 위한 테스트 계획을 작성해주세요"
      value: |
        - [ ] 단위 테스트
        - [ ] 로컬 실행 확인
        - [ ] Docker 실행 확인

name: 설정 작업 (Setting)
description: 환경/구성(Settings) 변경 작업을 위한 템플릿
title: "[Setting]: "
labels: ["setting"]
body:
  - type: input
    id: branch_keyword
    attributes:
      label: "Branch Keyword"
      description: "영문 소문자로 간결한 브랜치 명을 입력하세요 (예: docker-compose, ci-pipeline)"
    validations:
      required: true

  - type: input
    id: setting_title
    attributes:
      label: "설정 제목"
      description: "이번에 무엇을 세팅/변경하나요?"
      placeholder: "Docker Compose 구성 추가"
    validations:
      required: true

  - type: textarea
    id: setting_summary
    attributes:
      label: "설정 내용(간단히)"
      description: "무엇을, 왜, 어디에 세팅할지 짧게 적어주세요."
      placeholder: |
        - 대상: local / docker
        - 항목: docker-compose.yml, Dockerfile
        - 목적: 로컬 실행 환경 구성
    validations:
      required: true
